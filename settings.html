<div id="mnemosyne-settings" class="mnemosyne-panel">
  <div class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
      <b>Mnemosyne</b>
      <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">
      <label class="checkbox_label">
        <input id="mnemosyne-enabled" type="checkbox" checked>
        <span>Enable per-chat narrative memory</span>
      </label>
      <p id="mnemosyne-status" class="mnemosyne-muted">Integration adapter ready.</p>
    </div>
  </div>
</div>
